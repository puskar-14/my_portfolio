<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Soft pastel door frame -->
  <rect x="10" y="6" width="44" height="54" rx="6" fill="#F8F3ED" stroke="#4A443D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Door leaf with peach pastel fill -->
  <rect x="16" y="11" width="32" height="49" rx="4" fill="#FFDFBA" stroke="#4A443D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Upper panel -->
  <rect x="21" y="16" width="22" height="18" rx="2" fill="#FFEFE0" stroke="#8A7E72" stroke-width="1.5" stroke-dasharray="1 1"/>
  <path d="M32 16v18M21 25h22" stroke="#B3A293" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Lower panel -->
  <rect x="21" y="38" width="22" height="16" rx="2" fill="#FFEFE0" stroke="#8A7E72" stroke-width="1.5"/>
  <!-- Doorknob with warm golden touch -->
  <circle cx="42" cy="35" r="3" fill="#E6A15C" stroke="#4A443D" stroke-width="1.5"/>
  <!-- Little keyhole sparkle -->
  <path d="M42 34v2" stroke="#4A443D" stroke-width="1" stroke-linecap="round"/>
  <!-- Little plant leaf near doorway -->
  <path d="M12 58c-2-6 2-10 4-10 1 5-2 9-4 10z" fill="#B5EAD7" stroke="#4A443D" stroke-width="1.2"/>
</svg>